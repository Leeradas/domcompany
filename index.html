<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>         
        @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        
        body {
            background-image: url(fundop.jpeg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            text-align: center;
            font-family: "Fira Sans", sans-serif;
            font-weight: 400;
            font-style: normal;
            margin: 0;
            padding: 0;
        }

        /* Imagem de perfil do topo */
        .profile-img {
            border-radius: 50%;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 50px;
            width: 150px; /* Defina um tamanho padrão para sua foto de perfil */
            height: 150px;
            object-fit: cover;
        }

        h1 {
            display: block;
            margin: 20px auto 10px auto;
            width: 100%;             
            max-width: 280px;        
            color: #ffffff;          
            font-size: 30px;         
            font-weight: bold;       
            text-align: center;      
        }

        h2 {
            display: block;
            margin: 5px auto;
            width: 100%;             
            max-width: 280px;        
            color: #ffffff;          
            font-size: 17px;         
            font-weight: bold;       
            text-align: center;      
        }

        /* O BOTÃO AGORA É O LINK INTEIRO */
        .btn-link {
            box-sizing: border-box;
            display: flex;            
            align-items: center;
            justify-content: center;  
            gap: 12px;                /* Espaço perfeito entre ícone e texto */
            
            width: 90%;               
            max-width: 300px;         
            height: 55px;             /* Altura fixa para manter todos os botões iguais */
            margin: 15px auto;        
            padding: 0 20px;       
            
            background-color: #ffffff; 
            color: #000000;           
            font-size: 16px;          
            font-weight: bold;        
            text-decoration: none;    /* Remove o sublinhado do link */
            
            border-radius: 30px;      
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); 
            cursor: pointer;          
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            transform: translateY(-2px); /* Efeito suave ao passar o mouse */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* ÍCONES INTERNOS DOS BOTÕES */
        .btn-link img {
            display: block;
            width: 40px;              /* Tamanho perfeito e centralizado para ícones */
            height: 40px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 50%;         /* Remove o arredondamento de 50% da regra global */
            margin: 0;                /* Reseta as margens da regra global */
        }
    </style>
    <title>Domcompany</title>
</head>
<body>

    <!-- Adicionada a classe profile-img para não misturar com os ícones dos botões -->
    <picture>
        <source media="(max-width: 1000px)" srcset="domcompanyp.jpg" type="image/png">

        <img src="consultor.jpeg" alt="Ícone Consultor">
        <span>Consultor - Renan</span>
    </a>

        <span>Grupo VIP</span>
    </a>

</body>
</html>
